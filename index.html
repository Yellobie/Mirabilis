<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141223">
<title>Mirabilis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141223;
  --ink-2:#1C1A2E;
  --surface:#221F38;
  --surface-2:#2C2846;
  --line:#3A3459;
  --text:#EDE9F7;
  --muted:#948CB4;
  --muted-2:#6E668C;
  --danger:#E4767C;
  --accent:#E8B45E;
  --radius:14px;
  --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:system-ui,-apple-system,"Roboto",sans-serif;
  font-size:16px;
  line-height:1.5;
  overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}

/* ---------- Chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:rgba(20,18,35,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar__title{
  flex:1;min-width:0;
  font-family:"Fraunces",Georgia,serif;
  font-size:19px;font-weight:500;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.iconbtn{
  min-width:var(--tap);height:var(--tap);
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--muted);font-size:20px;flex:0 0 auto;
}
.iconbtn:active{background:var(--surface)}
.iconbtn--text{font-size:14px;padding:0 12px;color:var(--muted);font-weight:500}
.wrap{padding:16px 16px 110px;max-width:720px;margin:0 auto}

/* ---------- Home ---------- */
.sky{
  position:relative;
  padding:34px 16px 22px;
  background:
    radial-gradient(120% 90% at 70% -10%, rgba(232,180,94,.13), transparent 60%),
    radial-gradient(90% 70% at 12% 0%, rgba(107,166,242,.12), transparent 62%);
  overflow:hidden;
}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.sky__inner{position:relative}
.sky__eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:6px;
}
.sky__title{
  font-family:"Fraunces",Georgia,serif;
  font-size:34px;font-weight:300;line-height:1.1;margin:0;
}
.sky__sub{color:var(--muted);font-size:14px;margin:8px 0 0}

.capture{
  display:flex;align-items:center;gap:12px;width:100%;
  margin:22px 0 26px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);text-align:left;
}
.capture:active{background:var(--surface-2)}
.capture__mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--accent);font-size:19px;line-height:1;
}
.capture__label{font-weight:600;font-size:15px}
.capture__hint{color:var(--muted);font-size:12.5px}

.sectionlabel{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted-2);margin:0 0 10px;
}

/* project spines */
.spine{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--pj,var(--accent));
  border-radius:var(--radius);
  padding:16px 16px 14px 18px;margin-bottom:12px;
}
.spine:active{background:var(--surface-2)}
.spine__name{
  font-family:"Fraunces",Georgia,serif;
  font-size:20px;font-weight:500;line-height:1.2;
}
.spine__counts{
  display:flex;flex-wrap:wrap;gap:4px 14px;
  margin-top:10px;color:var(--muted);font-size:12.5px;
}
.spine__counts b{color:var(--pj,var(--accent));font-weight:600}
.spine__empty{margin-top:8px;color:var(--muted-2);font-size:13px;font-style:italic}

.ghostbtn{
  width:100%;padding:13px;border:1px dashed var(--line);
  border-radius:var(--radius);color:var(--muted);font-size:14px;
}
.ghostbtn:active{background:var(--surface)}

/* ---------- Project menu ---------- */
.menurow{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:15px 14px;margin-bottom:10px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
.menurow:active{background:var(--surface-2)}
.menurow__glyph{
  width:36px;height:36px;flex:0 0 auto;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--pj,var(--accent));font-size:16px;
}
.menurow__name{font-weight:600;font-size:15.5px}
.menurow__meta{color:var(--muted);font-size:12.5px}
.menurow__chev{margin-left:auto;color:var(--muted-2);font-size:18px}

/* ---------- Lists ---------- */
.search{
  display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;margin-bottom:14px;
}
.search input{
  flex:1;background:none;border:none;outline:none;
  padding:12px 0;font-size:15px;
}
.search input::placeholder{color:var(--muted-2)}
.search__icon{color:var(--muted-2);font-size:14px}

.card{
  display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;
}
.card:active{background:var(--surface-2)}
.card__title{font-weight:600;font-size:15.5px;line-height:1.3}
.card__sub{color:var(--muted);font-size:13px;margin-top:3px}
.card__body{color:var(--muted);font-size:13.5px;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card__foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}

.empty{text-align:center;padding:46px 20px;color:var(--muted-2)}
.empty__title{font-family:"Fraunces",Georgia,serif;font-size:19px;color:var(--muted);margin-bottom:6px}
.empty__text{font-size:13.5px;line-height:1.6}

.fab{
  position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:45;
  height:54px;padding:0 22px;border-radius:27px;
  background:var(--pj,var(--accent));color:#191527;
  font-weight:700;font-size:15px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
  display:flex;align-items:center;gap:8px;
}
.fab:active{transform:translateY(1px)}

/* ---------- Forms ---------- */
.group{margin:26px 0 4px}
.group:first-child{margin-top:4px}
.group__label{
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted-2);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
.field{margin-bottom:16px}
.field__label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;background:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;outline:none;font-size:15.5px;
}
.field textarea{resize:none;min-height:52px;line-height:1.55;overflow:hidden}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pj,var(--accent))}
.field__hint{font-size:12px;color:var(--muted-2);margin-top:5px}

.seg{display:flex;gap:8px}
.seg button{
  flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-size:13.5px;background:var(--ink-2);
}
.seg button.on{background:var(--pj,var(--accent));color:#191527;border-color:transparent;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:999px;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
}
.chip--tag{background:transparent;color:var(--muted);border-color:var(--line)}
.chip--tag .chip__x,.chip .chip__x{color:var(--muted-2);font-size:15px;line-height:1;padding:0 1px}
.chip--static{padding:4px 9px;font-size:11.5px;color:var(--muted)}
.chip--status{padding:4px 9px;font-size:11.5px;border-color:transparent;background:rgba(232,180,94,.16);color:var(--accent)}
.chip--add{border-style:dashed;color:var(--muted);background:transparent}

.tagline{display:flex;gap:8px;margin-top:9px}
.tagline input{
  flex:1;background:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;outline:none;font-size:15px;
}
.tagline button{
  padding:0 15px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted);font-size:14px;
}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pool button{
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted-2);font-size:12.5px;background:transparent;
}

.rel{
  display:flex;gap:8px;align-items:center;
  background:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:9px 10px;margin-bottom:8px;
}
.rel__name{flex:0 0 auto;max-width:42%;font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel__type{flex:1;min-width:0;background:transparent;border:none;outline:none;
  border-bottom:1px dashed var(--line);padding:3px 0;font-size:14px}
.rel__x{color:var(--muted-2);font-size:18px;padding:0 4px}

.dangerzone{margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.dangerbtn{
  width:100%;padding:13px;border-radius:11px;
  border:1px solid rgba(228,118,124,.35);color:var(--danger);font-size:14.5px;
}
.dangerbtn:active{background:rgba(228,118,124,.1)}

.saved{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:60;
  background:var(--surface-2);border:1px solid var(--line);
  padding:9px 16px;border-radius:999px;font-size:13px;color:var(--muted);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.saved.show{opacity:1}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:70;background:rgba(10,9,18,.72);
  display:flex;align-items:flex-end;
}
.sheet{
  width:100%;max-height:82vh;display:flex;flex-direction:column;
  background:var(--ink-2);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding-bottom:env(safe-area-inset-bottom);
  animation:rise .22s ease-out;
}
@keyframes rise{from{transform:translateY(14px);opacity:.5}to{transform:none;opacity:1}}
.sheet__head{
  display:flex;align-items:center;gap:8px;padding:14px 14px 10px;
  border-bottom:1px solid var(--line);
}
.sheet__title{flex:1;font-family:"Fraunces",Georgia,serif;font-size:17px}
.sheet__body{overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.pick{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:12px 12px;border-radius:11px;margin-bottom:6px;
  border:1px solid var(--line);background:var(--surface);
}
.pick.on{border-color:var(--pj,var(--accent));background:var(--surface-2)}
.pick__box{
  width:20px;height:20px;flex:0 0 auto;border-radius:6px;
  border:1.5px solid var(--muted-2);display:flex;align-items:center;
  justify-content:center;font-size:12px;color:#191527;
}
.pick.on .pick__box{background:var(--pj,var(--accent));border-color:transparent}
.pick__name{flex:1;min-width:0;font-size:15px}
.sheet__actions{padding:10px 14px 16px;border-top:1px solid var(--line)}
.primarybtn{
  width:100%;padding:14px;border-radius:12px;
  background:var(--pj,var(--accent));color:#191527;font-weight:700;font-size:15px;
}

/* ---------- Note reading ---------- */
.md{font-size:15.5px;line-height:1.65}
.md h1,.md h2,.md h3{font-family:"Fraunces",Georgia,serif;font-weight:500;margin:18px 0 8px;line-height:1.25}
.md h1{font-size:23px}.md h2{font-size:20px}.md h3{font-size:17px}
.md p{margin:0 0 12px}
.md li{margin-bottom:5px}
.md strong{font-weight:700}
.md em{font-style:italic}

/* ---------- Backup ---------- */
.info{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px 16px;margin-bottom:14px;
}
.info h3{margin:0 0 6px;font-size:15px}
.info p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.info__stat{color:var(--muted);font-size:13px;margin-top:10px}
.actionbtn{
  width:100%;padding:14px;border-radius:12px;margin-top:12px;
  background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:600;
}
.actionbtn:active{background:var(--line)}
.actionbtn--key{background:var(--accent);color:#191527;border-color:transparent}
.syncpill{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:999px;font-size:11.5px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);flex:0 0 auto;
}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.syncdot.ok{background:#7FCB9C}
.syncdot.busy{background:var(--accent);animation:pulse 1s infinite}
.syncdot.off{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:13px;border-radius:12px;
  background:#fff;color:#1f1f1f;font-weight:600;font-size:14.5px;
  border:1px solid var(--line);
}
.gbtn:active{background:#eee}
.gbtn img{width:18px;height:18px}
.acctrow{display:flex;align-items:center;gap:12px}
.acctrow__av{width:38px;height:38px;border-radius:50%;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="saved" id="saved">Enregistré</div>
<input type="file" id="importfile" accept="application/json,.json" style="display:none">

<script>
"use strict";

/* =========================================================
   1. MODÈLE DE DONNÉES
   ========================================================= */

var STORE_KEY = "atelier.worldbuilding.v1";
var ACCENTS = ["#E8B45E","#52B79C","#6BA6F2","#C98BD8","#E4867A","#8FBF63"];

var KINDS = ["characters","locations","factions","events","notes"];

var SCHEMA = {
  characters:{
    plural:"Personnages", singular:"Personnage", glyph:"✦", title:"name",
    fields:[
      {g:"Identité"},
      {k:"name",     l:"Nom complet", t:"text"},
      {k:"aliases",  l:"Surnoms / alias", t:"text"},
      {k:"age",      l:"Âge", t:"text"},
      {k:"role",     l:"Rôle narratif", t:"select",
        opts:["","Protagoniste","Antagoniste","Secondaire","Figurant","Mentor","Allié"]},
      {g:"Apparence"},
      {k:"appearance", l:"Description physique", t:"area"},
      {g:"Psychologie"},
      {k:"motivation", l:"Motivation principale", t:"area"},
      {k:"fear",       l:"Peur / faille", t:"area"},
      {k:"trait",      l:"Trait de caractère dominant", t:"text"},
      {g:"Background"},
      {k:"background", l:"Origine / histoire avant le récit", t:"area"},
      {g:"Relations"},
      {k:"relationships", l:"Liens avec d'autres personnages", t:"rel"},
      {g:"Champs libres"},
      {k:"free1", l:"Notes complémentaires", t:"area"},
      {k:"free2", l:"Citations caractéristiques", t:"area"},
      {k:"free3", l:"Divers", t:"area"}
    ]
  },
  locations:{
    plural:"Lieux", singular:"Lieu", glyph:"◈", title:"name",
    fields:[
      {g:"Identité"},
      {k:"name",   l:"Nom", t:"text"},
      {k:"type",   l:"Type", t:"text", hint:"Ville, région, vaisseau, bâtiment…"},
      {k:"parent", l:"Lieu parent", t:"one", kind:"locations"},
      {g:"Description"},
      {k:"geography",  l:"Géographie / cadre physique", t:"area"},
      {k:"atmosphere", l:"Ambiance / atmosphère", t:"area"},
      {g:"Contexte narratif"},
      {k:"importance", l:"Importance dans l'intrigue", t:"area"},
      {k:"characters", l:"Personnages associés", t:"many", kind:"characters"},
      {g:"Champs libres"},
      {k:"free1", l:"Notes complémentaires", t:"area"},
      {k:"free2", l:"Histoire du lieu", t:"area"},
      {k:"free3", l:"Divers", t:"area"}
    ]
  },
  factions:{
    plural:"Factions", singular:"Faction", glyph:"❖", title:"name",
    fields:[
      {g:"Identité"},
      {k:"name", l:"Nom", t:"text"},
      {k:"type", l:"Type", t:"text", hint:"Faction, religion, système de magie, culture…"},
      {g:"Description"},
      {k:"rules", l:"Fonctionnement / règles", t:"area"},
      {k:"goals", l:"Objectifs / idéologie", t:"area"},
      {g:"Contexte narratif"},
      {k:"members",   l:"Membres", t:"many", kind:"characters"},
      {k:"locations", l:"Lieux associés", t:"many", kind:"locations"},
      {g:"Champs libres"},
      {k:"free1", l:"Notes complémentaires", t:"area"},
      {k:"free2", l:"Histoire / origines", t:"area"},
      {k:"free3", l:"Divers", t:"area"}
    ]
  },
  events:{
    plural:"Événements", singular:"Événement", glyph:"�averse", title:"title",
    fields:[
      {g:"Identité"},
      {k:"title", l:"Titre", t:"text"},
      {k:"date",  l:"Date fictive", t:"text", hint:"Date du monde, ou position relative (« peu après la chute »)"},
      {k:"order", l:"Ordre chronologique", t:"num", hint:"Sert à trier la frise quand la date est floue"},
      {g:"Contenu"},
      {k:"description",  l:"Description / ce qui se passe", t:"area"},
      {k:"consequences", l:"Conséquences / impact sur l'intrigue", t:"area"},
      {g:"Contexte narratif"},
      {k:"characters", l:"Personnages impliqués", t:"many", kind:"characters"},
      {k:"location",   l:"Lieu", t:"one", kind:"locations"},
      {k:"chapter",    l:"Chapitre associé", t:"text", hint:"Optionnel"},
      {g:"Champs libres"},
      {k:"free1", l:"Notes complémentaires", t:"area"},
      {k:"free2", l:"Foreshadowing lié", t:"area", hint:"Les indices semés qu'il faudra payer plus tard"},
      {k:"free3", l:"Divers", t:"area"}
    ]
  },
  notes:{
    plural:"Notes", singular:"Note", glyph:"✎", title:"content",
    fields:[
      {k:"content", l:"", t:"area", big:true, ph:"Jette ton idée ici…"},
      {g:"Classement"},
      {k:"tags",   l:"Tags", t:"tags"},
      {k:"status", l:"Statut", t:"status"},
      {g:"Rattachements"},
      {k:"characters", l:"Personnages", t:"many", kind:"characters"},
      {k:"locations",  l:"Lieux",       t:"many", kind:"locations"},
      {k:"factions",   l:"Factions",    t:"many", kind:"factions"},
      {k:"events",     l:"Événements",  t:"many", kind:"events"}
    ]
  }
};
SCHEMA.events.glyph = "◷";

/* ---- persistance ---- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function blankProject(name, accent){
  return { id:uid(), name:name, accent:accent,
           characters:[], locations:[], factions:[], events:[], notes:[] };
}
function seed(){
  return { version:1, updatedAt:Date.now(), projects:[
    blankProject("Les Étoiles Gardiennes", ACCENTS[0]),
    blankProject("La Quête de l'Izocime",  ACCENTS[1]),
    blankProject("StarSailors",            ACCENTS[2])
  ]};
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seed();
    var d = JSON.parse(raw);
    if(!d || !Array.isArray(d.projects)) return seed();
    d.projects.forEach(function(p){
      KINDS.forEach(function(k){ if(!Array.isArray(p[k])) p[k] = []; });
      if(!p.accent) p.accent = ACCENTS[0];
    });
    return d;
  }catch(e){ return seed(); }
}
var DB = load();

var saveTimer=null, savedEl=null;
function save(quiet){
  DB.updatedAt = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ alert("Sauvegarde locale impossible : la mémoire du navigateur est pleine. Exporte ton JSON pour ne rien perdre."); return; }
  if(!quiet){
    savedEl = savedEl || document.getElementById("saved");
    savedEl.classList.add("show");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ savedEl.classList.remove("show"); }, 1100);
  }

function item(pid,kind,id){ var p=proj(pid); if(!p) return null;
  for(var i=0;i<p[kind].length;i++) if(p[kind][i].id===id) return p[kind][i]; return null; }
function labelOf(kind,obj){
  if(!obj) return "—";
  if(kind==="notes"){ var s=(obj.content||"").trim().split("\n")[0]; return s ? (s.length>46?s.slice(0,46)+"…":s) : "Note sans texte"; }
  var t = obj[SCHEMA[kind].title];
  return (t && String(t).trim()) ? t : "Sans titre";
}
function allTags(p){
  var set={}, out=[];
  p.notes.forEach(function(n){ (n.tags||[]).forEach(function(t){ if(!set[t]){set[t]=1;out.push(t);} }); });
  return out.sort(function(a,b){ return a.localeCompare(b,"fr"); });
}
function isEmptyItem(kind,obj){
  var f = SCHEMA[kind].fields;
  for(var i=0;i<f.length;i++){
    if(f[i].g) continue;
    var v = obj[f[i].k];
    if(v===undefined||v===null||v==="") continue;
    if(Array.isArray(v)){ if(v.length) return false; continue; }
    if(f[i].k==="status") continue;
    return false;
  }
  return true;
}

  function mergeItemArray(localArr, remoteArr, baselineArr, conflicts, ctx){
    var lm=indexById(localArr), rm=indexById(remoteArr), bm=indexById(baselineArr||[]);
    var ids={}; Object.keys(lm).forEach(function(k){ids[k]=1;}); Object.keys(rm).forEach(function(k){ids[k]=1;});
    var out=[];
    Object.keys(ids).forEach(function(id){
      var L=lm[id], R=rm[id], B=bm[id];
      if(L && R){
        if(deepEq(L,R)){ out.push(L); return; }
        if(B && deepEq(L,B)){ out.push(R); return; }
        if(B && deepEq(R,B)){ out.push(L); return; }
        var s1={__conflict:true,id:id}; out.push(s1);
        conflicts.push({ctx:ctx,id:id,local:L,remote:R,type:"edit",slotArr:out});
        return;
      }
      if(L && !R){
        if(!B){ out.push(L); return; }
        if(deepEq(L,B)){ return; }
        var s2={__conflict:true,id:id}; out.push(s2);
        conflicts.push({ctx:ctx,id:id,local:L,remote:null,type:"delete_remote",slotArr:out});
        return;
      }
      if(R && !L){
        if(!B){ out.push(R); return; }
        if(deepEq(R,B)){ return; }
        var s3={__conflict:true,id:id}; out.push(s3);
        conflicts.push({ctx:ctx,id:id,local:null,remote:R,type:"delete_local",slotArr:out});
        return;
      }
    });

  function mergeProjects(localP, remoteP, baselineP, conflicts){
    var lm=indexById(localP), rm=indexById(remoteP), bm=indexById(baselineP||[]);
    var ids={}; Object.keys(lm).forEach(function(k){ids[k]=1;}); Object.keys(rm).forEach(function(k){ids[k]=1;});
    var out=[];
    Object.keys(ids).forEach(function(id){
      var L=lm[id], R=rm[id], B=bm[id];
      if(L && R){
        var proj={id:id};
        ["name","accent"].forEach(function(f){
          if(L[f]===R[f]) proj[f]=L[f];
          else if(B && L[f]===B[f]) proj[f]=R[f];
          else if(B && R[f]===B[f]) proj[f]=L[f];
          else proj[f]=L[f];
        });

          proj[k] = mergeItemArray(L[k]||[], R[k]||[], (B&&B[k])||[], conflicts, {projectId:id, projectName:proj.name, kind:k});

  function findFile(name, parent, isFolder){

function mdToHtml(src){
  var esc = String(src||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  var lines = esc.split("\n"), out=[], list=false;
  function closeList(){ if(list){ out.push("</ul>"); list=false; } }
  lines.forEach(function(ln){
    var m;
    if((m = ln.match(/^###\s+(.*)/))){ closeList(); out.push("<h3>"+m[1]+"</h3>"); return; }
    if((m = ln.match(/^##\s+(.*)/))) { closeList(); out.push("<h2>"+m[1]+"</h2>"); return; }
    if((m = ln.match(/^#\s+(.*)/)))  { closeList(); out.push("<h1>"+m[1]+"</h1>"); return; }
    if((m = ln.match(/^\s*[-*]\s+(.*)/))){ if(!list){ out.push("<ul>"); list=true; } out.push("<li>"+m[1]+"</li>"); return; }
    if(ln.trim()===""){ closeList(); return; }
    closeList(); out.push("<p>"+ln+"</p>");
  });
  closeList();
  return out.join("")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
}

  else if(st==="connecting" || st==="syncing"){ dot="busy"; label="Synchro…"; }
  else if(st==="synced" || st==="idle"){ dot="ok"; label = Drive.getEmail() || "Synchronisé"; }
  else if(st==="error"){ dot="off"; label="Hors ligne"; }
  pill.innerHTML = "";
  pill.appendChild(el("span","syncdot "+dot));
  pill.appendChild(el("span",null,label));
}

function starfield(cv){
  var r = cv.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  var ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);
  for(var i=0;i<46;i++){
    var x = Math.random()*r.width, y = Math.random()*r.height;
    var rad = Math.random()*1.1 + 0.3;
    ctx.globalAlpha = 0.15 + Math.random()*0.5;
    ctx.fillStyle = "#F2ECFF";
    ctx.beginPath(); ctx.arc(x,y,rad,0,6.284); ctx.fill();
  }
}

/* ---- liste ---- */
function newItem(pid, kind){
  var o = {id:uid(), createdAt:Date.now()};
  SCHEMA[kind].fields.forEach(function(f){
    if(f.g) return;
    if(f.t==="many"||f.t==="tags"||f.t==="rel") o[f.k] = [];
    else if(f.t==="status") o[f.k] = "todo";
    else o[f.k] = "";
  });
  proj(pid)[kind].unshift(o);
  save(true);
  return o;
}

function sortItems(kind, arr){
  var a = arr.slice();
  if(kind==="events"){
    a.sort(function(x,y){
      var ox = x.order===""||x.order===undefined ? 1e9 : Number(x.order);
      var oy = y.order===""||y.order===undefined ? 1e9 : Number(y.order);
      if(ox!==oy) return ox-oy;
      return labelOf(kind,x).localeCompare(labelOf(kind,y),"fr");
    });
  }else if(kind==="notes"){
    a.sort(function(x,y){ return (y.createdAt||0)-(x.createdAt||0); });
  }else{
    a.sort(function(x,y){ return labelOf(kind,x).localeCompare(labelOf(kind,y),"fr"); });
  }
  return a;
}

function viewList(pid, kind){
  var p = proj(pid);
  if(!p) return back();
  var S = SCHEMA[kind];
  app.appendChild(topbar(S.plural));
  var w = el("div","wrap");
  w.style.setProperty("--pj", p.accent);
  app.appendChild(w);

  var query = "", tagFilter = "";

  var s = el("div","search");
  s.appendChild(el("span","search__icon","⌕"));
  var inp = document.createElement("input");
  inp.type="text"; inp.placeholder = "Rechercher dans les " + S.plural.toLowerCase();
  s.appendChild(inp); w.appendChild(s);

  var tagRow = null;
  if(kind==="notes"){
    var tags = allTags(p);
    if(tags.length){
      tagRow = el("div","pool"); tagRow.style.marginBottom = "14px";
      var mk = function(label, value){
        var b = el("button", null, label);
        b.onclick = function(){ tagFilter = (tagFilter===value?"":value); draw(); paintTags(); };
        return b;
      };
      tagRow.appendChild(mk("Tous",""));
      tags.forEach(function(t){ tagRow.appendChild(mk("#"+t, t)); });
      w.appendChild(tagRow);
    }
  }
  function paintTags(){
    if(!tagRow) return;
    var btns = tagRow.querySelectorAll("button");
    var vals = [""].concat(allTags(p));
    for(var i=0;i<btns.length;i++){
      var on = vals[i]===tagFilter;
      btns[i].style.color = on ? p.accent : "";
      btns[i].style.borderColor = on ? p.accent : "";
    }
  }

  var listBox = el("div"); w.appendChild(listBox);

  function matches(o){
    if(tagFilter && (o.tags||[]).indexOf(tagFilter)<0) return false;
    if(!query) return true;
    var q = query.toLowerCase(), hit = false;
    S.fields.forEach(function(f){
      if(f.g || hit) return;
      var v = o[f.k];
      if(typeof v === "string" && v.toLowerCase().indexOf(q)>=0) hit = true;
    });
    if(!hit && (o.tags||[]).join(" ").toLowerCase().indexOf(q)>=0) hit = true;
    return hit;
  }

  function draw(){
    listBox.innerHTML = "";
    var arr = sortItems(kind, p[kind]).filter(matches);
    if(!arr.length){
      var e = el("div","empty");
      if(p[kind].length){
        e.appendChild(el("div","empty__title","Aucun résultat"));
        e.appendChild(el("div","empty__text","Essaie un autre mot."));
      }else{
        e.appendChild(el("div","empty__title","Rien ici pour l'instant"));
        e.appendChild(el("div","empty__text","Appuie sur le bouton en bas pour créer " +
          (kind==="events"||kind==="factions"||kind==="locations"||kind==="notes" ? "" : "") +
          "ta première fiche."));
      }
      listBox.appendChild(e);
      return;
    }
    arr.forEach(function(o){
      var c = el("button","card");
      c.appendChild(el("div","card__title", labelOf(kind,o)));

      if(kind==="characters"){
        var bits = [];
        if(o.role) bits.push(o.role);
        if(o.age) bits.push(o.age + " ans");
        if(o.aliases) bits.push("« " + o.aliases + " »");
        if(bits.length) c.appendChild(el("div","card__sub", bits.join(" · ")));
        if(o.motivation) c.appendChild(el("div","card__body", o.motivation));
      }
      else if(kind==="locations"){
        var sub = [];
        if(o.type) sub.push(o.type);
        var par = o.parent && item(pid,"locations",o.parent);
        if(par) sub.push("dans " + labelOf("locations",par));
        if(sub.length) c.appendChild(el("div","card__sub", sub.join(" · ")));
        if(o.atmosphere) c.appendChild(el("div","card__body", o.atmosphere));
      }
      else if(kind==="factions"){
        if(o.type) c.appendChild(el("div","card__sub", o.type));
        if(o.goals) c.appendChild(el("div","card__body", o.goals));
      }
      else if(kind==="events"){
        var sub2 = [];
        if(o.order!=="" && o.order!==undefined) sub2.push("#" + o.order);
        if(o.date) sub2.push(o.date);
        var loc = o.location && item(pid,"locations",o.location);
        if(loc) sub2.push(labelOf("locations",loc));
        if(sub2.length) c.appendChild(el("div","card__sub", sub2.join(" · ")));
        if(o.description) c.appendChild(el("div","card__body", o.description));
      }
      else if(kind==="notes"){
        var rest = (o.content||"").split("\n").slice(1).join(" ").trim();
        if(rest) c.appendChild(el("div","card__body", rest));
        var foot = el("div","card__foot");
        foot.appendChild(el("span","chip chip--static", fmtDate(o.createdAt)));
        if(o.status!=="done"){
          var st = el("span","chip chip--status","à trier");
          st.style.background = "rgba(255,255,255,.07)";
          st.style.color = p.accent;
          foot.appendChild(st);
        }
        (o.tags||[]).forEach(function(t){ foot.appendChild(el("span","chip chip--static","#"+t)); });
        c.appendChild(foot);
      }

      c.onclick = function(){ go({v:"item", pid:pid, kind:kind, id:o.id}); };
      listBox.appendChild(c);
    });
  }

  inp.oninput = function(){ query = inp.value.trim(); draw(); };
  draw(); paintTags();

  var fab = el("button","fab");
  fab.style.setProperty("--pj", p.accent);
  fab.textContent = "+  " + (kind==="notes" ? "Note" : S.singular);
  fab.onclick = function(){
    var o = newItem(pid, kind);
    go({v:"item", pid:pid, kind:kind, id:o.id, isNew:true});
  };
  app.appendChild(fab);
}

  app.appendChild(topbar(labelOf(kind,o), {

  }));

    if(f.g){
      cur = el("div","group");
      cur.appendChild(el("div","group__label", f.g));
      w.appendChild(cur);
      return;

    var host = cur || w;
    host.appendChild(buildField(f, o, pid, kind, touch, p));

    var arr = p[kind];
    for(var i=0;i<arr.length;i++) if(arr[i].id===id){ arr.splice(i,1); break; }
    /* nettoyage des liens qui pointaient vers elle */
    KINDS.forEach(function(k){
      p[k].forEach(function(x){
        SCHEMA[k].fields.forEach(function(f){
          if(f.t==="many" && f.kind===kind && Array.isArray(x[f.k]))
            x[f.k] = x[f.k].filter(function(v){ return v!==id; });
          if(f.t==="one" && f.kind===kind && x[f.k]===id) x[f.k] = "";
          if(f.t==="rel" && kind==="characters" && Array.isArray(x[f.k]))
            x[f.k] = x[f.k].filter(function(r){ return r.id!==id; });
        });
      });
    });
    save();
    nav[nav.length-1].isNew = false;
    back();
  };
  dz.appendChild(d); w.appendChild(dz);
}

    if(!(o.content||"").trim()) d.innerHTML = "<p style='color:#6E668C'>Note vide.</p>";

/* ---- construction d'un champ ---- */
function buildField(f, o, pid, kind, touch, p){
  var box = el("div","field");
  if(f.l) box.appendChild(el("label","field__label", f.l));

  if(f.t==="text" || f.t==="num"){
    var i = document.createElement("input");
    i.type = f.t==="num" ? "number" : "text";
    if(f.t==="num") i.inputMode = "numeric";
    i.value = o[f.k] || "";
    i.oninput = function(){ o[f.k] = i.value; touch(); };
    box.appendChild(i);
  }
  else if(f.t==="area"){
    var ta = document.createElement("textarea");
    ta.value = o[f.k] || "";
    if(f.ph) ta.placeholder = f.ph;
    if(f.big){ ta.style.minHeight = "180px"; ta.style.fontSize = "16px"; }
    ta.oninput = function(){ o[f.k] = ta.value; autogrow(ta); touch(); };
    box.appendChild(ta);
    setTimeout(function(){ autogrow(ta); if(f.big) ta.style.height = Math.max(ta.scrollHeight,180)+"px"; },0);
  }
  else if(f.t==="select"){
    var sl = document.createElement("select");
    f.opts.forEach(function(op){
      var oe = document.createElement("option");
      oe.value = op; oe.textContent = op || "— non défini —";
      sl.appendChild(oe);
    });
    sl.value = o[f.k] || "";
    sl.onchange = function(){ o[f.k] = sl.value; touch(); };
    box.appendChild(sl);
  }
  else if(f.t==="status"){
    var seg = el("div","seg");
    [["todo","À trier"],["done","Traité"]].forEach(function(pair){
      var b = el("button", (o[f.k]||"todo")===pair[0] ? "on" : "", pair[1]);
      b.onclick = function(){ o[f.k] = pair[0]; touch(); redraw(); };
      seg.appendChild(b);
    });
    box.appendChild(seg);
    var redraw = function(){
      var bs = seg.querySelectorAll("button");
      bs[0].className = (o[f.k]==="todo") ? "on" : "";
      bs[1].className = (o[f.k]==="done") ? "on" : "";
    };
  }
  else if(f.t==="tags"){
    var chips = el("div","chips");
    box.appendChild(chips);
    var line = el("div","tagline");
    var ti = document.createElement("input");
    ti.type="text"; ti.placeholder="Nouveau tag";
    var addb = el("button", null, "Ajouter");
    line.appendChild(ti); line.appendChild(addb);
    box.appendChild(line);
    var pool = el("div","pool"); box.appendChild(pool);

    function addTag(v){
      v = (v||"").trim().replace(/^#/,"");
      if(!v) return;
      o[f.k] = o[f.k] || [];
      if(o[f.k].indexOf(v)<0) o[f.k].push(v);
      ti.value = ""; touch(); drawTags();
    }
    addb.onclick = function(){ addTag(ti.value); };
    ti.onkeydown = function(e){
      if(e.key==="Enter" || e.key===","){ e.preventDefault(); addTag(ti.value); }
    };
    function drawTags(){
      chips.innerHTML = "";
      (o[f.k]||[]).forEach(function(t){
        var c = el("span","chip chip--tag");
        c.appendChild(document.createTextNode("#"+t));
        var x = el("button","chip__x","✕");
        x.onclick = function(){
          o[f.k] = o[f.k].filter(function(v){ return v!==t; });
          touch(); drawTags();
        };
        c.appendChild(x); chips.appendChild(c);
      });
      if(!(o[f.k]||[]).length) chips.appendChild(el("span","field__hint","Aucun tag"));
      pool.innerHTML = "";
      allTags(p).filter(function(t){ return (o[f.k]||[]).indexOf(t)<0; })
        .slice(0,14).forEach(function(t){
          var b = el("button", null, "+ "+t);
          b.onclick = function(){ addTag(t); };
          pool.appendChild(b);
        });
    }
    drawTags();
  }
  else if(f.t==="one" || f.t==="many"){
    var chips2 = el("div","chips"); box.appendChild(chips2);
    var multi = f.t==="many";

    function current(){
      if(multi) return (o[f.k]||[]).slice();
      return o[f.k] ? [o[f.k]] : [];
    }
    function options(){
      return proj(pid)[f.kind]
        .filter(function(x){ return !(f.kind===kind && x.id===o.id); })
        .map(function(x){ return {id:x.id, label:labelOf(f.kind,x)}; })
        .sort(function(a,b){ return a.label.localeCompare(b.label,"fr"); });
    }
    function drawLinks(){
      chips2.innerHTML = "";
      current().forEach(function(rid){
        var target = item(pid, f.kind, rid);
        if(!target) return;
        var c = el("span","chip");
        c.appendChild(document.createTextNode(labelOf(f.kind,target)));
        var x = el("button","chip__x","✕");
        x.onclick = function(e){
          e.stopPropagation();
          if(multi) o[f.k] = (o[f.k]||[]).filter(function(v){ return v!==rid; });
          else o[f.k] = "";
          touch(); drawLinks();
        };
        c.appendChild(x);
        c.onclick = function(){ go({v:"item", pid:pid, kind:f.kind, id:rid}); };
        chips2.appendChild(c);
      });
      var add = el("button","chip chip--add","+ Relier");
      add.onclick = function(){
        pickerSheet({
          title: f.l, options: options(), selected: current(), multi: multi,
          onDone: function(ids){
            if(multi) o[f.k] = ids;
            else o[f.k] = ids.length ? ids[0] : "";
            touch(); drawLinks();
          }
        });
      };
      chips2.appendChild(add);
    }
    drawLinks();
  }
  else if(f.t==="rel"){
    var host = el("div"); box.appendChild(host);
    function drawRels(){
      host.innerHTML = "";
      (o[f.k]||[]).forEach(function(r, idx){
        var target = item(pid,"characters",r.id);
        if(!target) return;
        var row = el("div","rel");
        var nm = el("button","rel__name", labelOf("characters",target));
        nm.onclick = function(){ go({v:"item", pid:pid, kind:"characters", id:r.id}); };
        row.appendChild(nm);
        var ti2 = document.createElement("input");
        ti2.type="text"; ti2.className="rel__type";
        ti2.placeholder="type de lien (sœur, mentor…)";
        ti2.value = r.type || "";
        ti2.oninput = function(){ r.type = ti2.value; touch(); };
        row.appendChild(ti2);
        var x = el("button","rel__x","✕");
        x.onclick = function(){ o[f.k].splice(idx,1); touch(); drawRels(); };
        row.appendChild(x);
        host.appendChild(row);
      });
      var add = el("button","chip chip--add","+ Ajouter une relation");
      add.onclick = function(){
        var taken = (o[f.k]||[]).map(function(r){ return r.id; });
        var opts = proj(pid).characters
          .filter(function(x){ return x.id!==o.id && taken.indexOf(x.id)<0; })
          .map(function(x){ return {id:x.id, label:labelOf("characters",x)}; })
          .sort(function(a,b){ return a.label.localeCompare(b.label,"fr"); });
        pickerSheet({
          title:"Relier à un personnage", options:opts, selected:[], multi:false,
          onDone:function(ids){
            if(!ids.length) return;
            o[f.k] = o[f.k] || [];
            o[f.k].push({id:ids[0], type:""});
            touch(); drawRels();
          }
        });
      };
      host.appendChild(add);
    }
    drawRels();
  }

  if(f.hint) box.appendChild(el("div","field__hint", f.hint));
  return box;
}

/* ---- sauvegarde ---- */
function viewBackup(){
  app.appendChild(topbar("Sauvegarde"));
  var w = el("div","wrap");

  var accBox = el("div","info");
  function paintAccount(){
    accBox.innerHTML = "";
    if(Drive.isConnected()){
      accBox.appendChild(el("h3",null,"Google Drive"));
      var row = el("div","acctrow"); row.style.margin = "10px 0";
      var av = el("div","acctrow__av", (Drive.getEmail()||"?").slice(0,1).toUpperCase());
      row.appendChild(av);
      var txt = el("div");
      txt.appendChild(el("div",null, Drive.getEmail() || "Connecté"));
      var sub = el("div","info__stat");
      sub.style.marginTop = "2px";
      var st = Drive.getStatus();
      var stTxt = {
        syncing:"Synchronisation en cours…",
        synced:"Dossier « Mirabilis » synchronisé — dernier envoi OK",
        error:"⚠ Dernière synchro en échec — voir ci-dessous",
        connecting:"Connexion en cours…"
      }[st] || "En attente de la première synchro";
      sub.textContent = stTxt;
      sub.style.color = st==="error" ? "var(--danger)" : "";
      txt.appendChild(sub);
      row.appendChild(txt);
      accBox.appendChild(row);

      var force = el("button","actionbtn","Synchroniser maintenant (test)");
      force.onclick = function(){
        force.textContent = "Synchronisation…";
        Drive.forceSync(function(ok, detail){
          force.textContent = "Synchroniser maintenant (test)";
          paintAccount();
          if(ok) alert("Synchro réussie. Vérifie le fichier mirabilis-data.json dans ton Drive.");
          else alert("Échec de la synchro : " + detail);
        });
      };
      accBox.appendChild(force);

      var out = el("button","actionbtn","Se déconnecter");
      out.onclick = function(){ Drive.signOut(); paintAccount(); };
      accBox.appendChild(out);
    }else{
      accBox.appendChild(el("h3",null,"Google Drive"));
      accBox.appendChild(el("p",null,"Connecte ton compte pour que tes projets se synchronisent automatiquement entre tous tes appareils, via un dossier « Mirabilis » dédié dans ton Drive."));
      var g = el("button","gbtn");
      g.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>' +
        '<span>Se connecter avec Google</span>';
      g.onclick = function(){ Drive.signIn(true); Drive.onStatus(function(){ paintAccount(); paintSyncPill(); }); };
      accBox.appendChild(g);
    }
  }
  paintAccount();
  w.appendChild(accBox);

  var counts = {};
  KINDS.forEach(function(k){ counts[k] = 0; });
  DB.projects.forEach(function(p){ KINDS.forEach(function(k){ counts[k] += p[k].length; }); });

  var i1 = el("div","info");
  i1.appendChild(el("h3","Où sont mes données"));
  i1.appendChild(el("p", Drive.isConnected()
    ? "Tout est enregistré dans ce navigateur à chaque frappe, puis synchronisé automatiquement vers ton dossier « Mirabilis » sur Google Drive quelques secondes après. C'est ce fichier Drive qui relie tes appareils entre eux."
    : "Tout est enregistré automatiquement dans ce navigateur, à chaque frappe. Sans connexion à Drive, ces données restent sur cet appareil uniquement — connecte-toi ci-dessus pour les synchroniser, ou exporte un JSON régulièrement en secours."));
  var stat = el("div","info__stat");
  stat.textContent = DB.projects.length + " projets · " +
    counts.characters + " personnages · " + counts.locations + " lieux · " +
    counts.factions + " factions · " + counts.events + " événements · " + counts.notes + " notes";
  i1.appendChild(stat);
  if(DB.updatedAt) i1.appendChild(el("div","info__stat","Dernière modification : " + new Date(DB.updatedAt).toLocaleString("fr-FR")));
  w.appendChild(i1);

  var exp = el("button","actionbtn actionbtn--key","Exporter en JSON");
  exp.onclick = doExport;
  w.appendChild(exp);

  var imp = el("button","actionbtn","Importer un fichier JSON");
  imp.onclick = function(){ document.getElementById("importfile").click(); };
  w.appendChild(imp);

  var i2 = el("div","info"); i2.style.marginTop = "22px";
  i2.appendChild(el("h3","À propos de l'import"));
  i2.appendChild(el("p","Importer un fichier remplace tout le contenu actuel de l'application. Exporte avant, si tu as un doute."));
  w.appendChild(i2);

  app.appendChild(w);
}

function doExport(){
  var d = new Date();
  var pad = function(n){ return n<10 ? "0"+n : ""+n; };
  var name = "worldbuilding-" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

document.getElementById("importfile").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(!d || !Array.isArray(d.projects)) throw new Error("format");
      if(!confirm("Remplacer tout le contenu actuel par ce fichier ?")) return;
      d.projects.forEach(function(p){
        KINDS.forEach(function(k){ if(!Array.isArray(p[k])) p[k] = []; });
        if(!p.accent) p.accent = ACCENTS[0];
        if(!p.id) p.id = uid();
      });
      DB = d; save();
      nav = [{v:"home"}]; history.replaceState({d:1},"");
      render();
      alert("Import terminé.");
    }catch(err){
      alert("Ce fichier n'est pas un export valide de l'application.");
    }
  };
  fr.readAsText(file);
  e.target.value = "";
});
